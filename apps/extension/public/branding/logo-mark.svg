<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Dark Titanium) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242428" />
      <stop offset="50%" stop-color="#161618" />
      <stop offset="100%" stop-color="#0d0d0f" />
    </linearGradient>

    <!-- Inset Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </linearGradient>

    <!-- Pulse Gradient (Cyan to Emerald) -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="45%" stop-color="#10b981" />
      <stop offset="75%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Globe Grid Gradient -->
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2" />
    </linearGradient>

    <!-- Radial Ambient Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Filter for Pulse -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Squircle Base with Shadow -->
  <rect
    x="24"
    y="24"
    width="464"
    height="464"
    rx="105"
    fill="url(#bgGrad)"
    filter="url(#dropShadow)"
  />

  <!-- Inset Bevel Stroke -->
  <rect
    x="24.5"
    y="24.5"
    width="463"
    height="463"
    rx="104.5"
    fill="none"
    stroke="url(#borderGrad)"
    stroke-width="1.5"
  />

  <!-- Inner Ambient Aura -->
  <circle cx="256" cy="256" r="160" fill="url(#ambientGlow)" />

  <!-- Stylized Domain Globe Grid -->
  <!-- Outer Globe Equator Ring -->
  <circle
    cx="256"
    cy="256"
    r="135"
    fill="none"
    stroke="url(#globeGrad)"
    stroke-width="3"
    stroke-dasharray="6 4"
  />

  <!-- Latitude Ellipse 1 (Upper) -->
  <ellipse
    cx="256"
    cy="210"
    rx="115"
    ry="48"
    fill="none"
    stroke="url(#globeGrad)"
    stroke-width="2"
    stroke-opacity="0.5"
  />

  <!-- Latitude Ellipse 2 (Lower) -->
  <ellipse
    cx="256"
    cy="302"
    rx="115"
    ry="48"
    fill="none"
    stroke="url(#globeGrad)"
    stroke-width="2"
    stroke-opacity="0.5"
  />

  <!-- Central Longitude Ellipse -->
  <ellipse
    cx="256"
    cy="256"
    rx="58"
    ry="135"
    fill="none"
    stroke="url(#globeGrad)"
    stroke-width="2.5"
    stroke-opacity="0.6"
  />

  <!-- The Vital Pulse / Heartbeat Waveform (Clean & Dynamic) -->
  <path
    d="M 68 256 H 168 L 196 215 L 226 312 L 260 148 L 298 358 L 328 224 L 350 256 H 444"
    fill="none"
    stroke="url(#pulseGrad)"
    stroke-width="16"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#neonGlow)"
  />

  <!-- Peak Vital Node (Glow Beacon) -->
  <circle cx="260" cy="148" r="9" fill="#ffffff" filter="url(#neonGlow)" />
  <circle cx="260" cy="148" r="5" fill="#10b981" />

  <!-- Origin / Destination Nodes -->
  <circle cx="68" cy="256" r="6" fill="#06b6d4" />
  <circle cx="444" cy="256" r="6" fill="#10b981" />
</svg>
