<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Crisp, high-contrast linear gradient (No blur, pure color) -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>

  <!-- Upper Domain Arc (The Web / Network Sphere) -->
  <path
    d="M 78 208 A 184 184 0 0 1 434 208"
    stroke="url(#brandGrad)"
    stroke-width="32"
    stroke-linecap="round"
  />

  <!-- Lower Domain Arc (The Web / Network Sphere) -->
  <path
    d="M 434 304 A 184 184 0 0 1 78 304"
    stroke="url(#brandGrad)"
    stroke-width="32"
    stroke-linecap="round"
  />

  <!-- High-Energy Cardiogram Pulse Waveform (The Vital Health Signs) -->
  <path
    d="M 44 256 H 168 L 208 308 L 256 108 L 304 404 L 344 204 L 372 256 H 468"
    stroke="url(#brandGrad)"
    stroke-width="36"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Apex Peak Beacon -->
  <circle cx="256" cy="108" r="16" fill="#FFFFFF" />
  <circle cx="256" cy="108" r="8" fill="#10B981" />
</svg>