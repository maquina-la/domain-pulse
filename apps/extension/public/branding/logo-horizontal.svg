<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgHGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242428" />
      <stop offset="100%" stop-color="#121214" />
    </linearGradient>

    <!-- Pulse Gradient -->
    <linearGradient id="pulseHGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Globe Grid Gradient -->
    <linearGradient id="globeHGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2" />
    </linearGradient>

    <!-- Filter Glow -->
    <filter id="neonHGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Left: Icon Mark (120x120) -->
  <g transform="translate(20, 20)">
    <!-- Squircle Base -->
    <rect x="0" y="0" width="120" height="120" rx="28" fill="url(#bgHGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2" />

    <!-- Globe Ring -->
    <circle cx="60" cy="60" r="38" fill="none" stroke="url(#globeHGrad)" stroke-width="1.5" stroke-dasharray="3 2" />
    <ellipse cx="60" cy="60" rx="16" ry="38" fill="none" stroke="url(#globeHGrad)" stroke-width="1.2" />

    <!-- Pulse Wave -->
    <path
      d="M 16 60 H 40 L 48 50 L 54 72 L 62 34 L 71 84 L 78 52 L 84 60 H 104"
      fill="none"
      stroke="url(#pulseHGrad)"
      stroke-width="4.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      filter="url(#neonHGlow)"
    />

    <!-- Peak Dot -->
    <circle cx="62" cy="34" r="3" fill="#ffffff" />
    <circle cx="62" cy="34" r="1.5" fill="#10b981" />
  </g>

  <!-- Right: Typography -->
  <text x="165" y="96" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="46" font-weight="800" letter-spacing="-1" fill="#f4f4f5">
    Domain<tspan fill="url(#pulseHGrad)">Pulse</tspan>
  </text>
  <text x="168" y="122" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="500" letter-spacing="1.5" text-transform="uppercase" fill="#a1a1aa">
    Real-Time Domain Health &amp; Infrastructure HUD
  </text>
</svg>
