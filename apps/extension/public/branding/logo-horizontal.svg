<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="100%" height="100%" fill="none">
  <defs>
    <!-- Crisp brand gradient -->
    <linearGradient id="brandHGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>

  <!-- Left: Freestanding Mark (Scaled to 130x130, No blur, crisp vector) -->
  <g transform="translate(15, 15) scale(0.254)">
    <!-- Upper Domain Arc -->
    <path
      d="M 78 208 A 184 184 0 0 1 434 208"
      stroke="url(#brandHGrad)"
      stroke-width="32"
      stroke-linecap="round"
    />
    <!-- Lower Domain Arc -->
    <path
      d="M 434 304 A 184 184 0 0 1 78 304"
      stroke="url(#brandHGrad)"
      stroke-width="32"
      stroke-linecap="round"
    />
    <!-- Cardiogram Pulse Waveform -->
    <path
      d="M 44 256 H 168 L 208 308 L 256 108 L 304 404 L 344 204 L 372 256 H 468"
      stroke="url(#brandHGrad)"
      stroke-width="36"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Apex Beacon -->
    <circle cx="256" cy="108" r="16" fill="#FFFFFF" />
    <circle cx="256" cy="108" r="8" fill="#10B981" />
  </g>

  <!-- Right: Sharp Brand Typography -->
  <g transform="translate(168, 0)">
    <text x="0" y="94" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5" fill="#F4F4F5">
      Domain<tspan fill="url(#brandHGrad)">Pulse</tspan>
    </text>
    <text x="2" y="122" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="2.2" text-transform="uppercase" fill="#A1A1AA">
      Real-Time Health &amp; Infrastructure HUD
    </text>
  </g>
</svg>