<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="100%" height="100%" fill="none">
  <defs>
    <!-- Pulse Gradient -->
    <linearGradient id="dpHPulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="45%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Globe Grid Gradient -->
    <linearGradient id="dpHGlobeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.35" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="dpHNeonGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Left: Freestanding Mark (No box/squircle, transparent background) -->
  <g transform="translate(18, 16)">
    <!-- Globe Ring -->
    <circle cx="64" cy="64" r="48" fill="none" stroke="url(#dpHGlobeGrad)" stroke-width="2.2" stroke-dasharray="4 3" />
    <!-- Globe Longitude -->
    <ellipse cx="64" cy="64" rx="20" ry="48" fill="none" stroke="url(#dpHGlobeGrad)" stroke-width="1.8" />
    <!-- Globe Latitude -->
    <ellipse cx="64" cy="64" rx="46" ry="18" fill="none" stroke="url(#dpHGlobeGrad)" stroke-width="1.4" stroke-opacity="0.6" />

    <!-- Pulse Wave (Freestanding) -->
    <path
      d="M 12 64 H 40 L 49 52 L 57 76 L 66 30 L 76 96 L 85 54 L 92 64 H 116"
      fill="none"
      stroke="url(#dpHPulseGrad)"
      stroke-width="5.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      filter="url(#dpHNeonGlow)"
    />

    <!-- Inner Crisp White Spine -->
    <path
      d="M 12 64 H 40 L 49 52 L 57 76 L 66 30 L 76 96 L 85 54 L 92 64 H 116"
      fill="none"
      stroke="#ffffff"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-opacity="0.8"
    />

    <!-- Peak Dot Beacon -->
    <circle cx="66" cy="30" r="3.5" fill="#ffffff" filter="url(#dpHNeonGlow)" />
    <circle cx="66" cy="30" r="1.8" fill="#10b981" />

    <!-- Terminal Dots -->
    <circle cx="12" cy="64" r="2.5" fill="#06b6d4" />
    <circle cx="116" cy="64" r="2.5" fill="#10b981" />
  </g>

  <!-- Right: Clean Typography (Freestanding) -->
  <g transform="translate(160, 0)">
    <text x="0" y="92" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5" fill="#f4f4f5">
      Domain<tspan fill="url(#dpHPulseGrad)">Pulse</tspan>
    </text>
    <text x="3" y="120" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="2" text-transform="uppercase" fill="#a1a1aa">
      Infrastructure &amp; Health HUD
    </text>
  </g>
</svg>